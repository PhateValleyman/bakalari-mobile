stages:
  - build
  - release
  - mirror

variables:
  NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"
  RELEASE_VERSION: "1.3"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pnpm-store/
    - .gradle/caches/
    - .gradle/wrapper/

.android:
  image: ghcr.io/cirruslabs/android-sdk:36-ndk
  stage: build
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates openjdk-17-jdk unzip git
    - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${NDK_VERSION}"
    - curl -fsSL "https://deb.nodesource.com/setup_${NODE_VERSION}.x" | bash -
    - apt-get install -y -qq nodejs
    - node --version
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm --version
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

build:redmi:
  extends: .android
  script:
    - npx expo prebuild --platform android --clean
    - grep -n 'ndkVersion' android/app/build.gradle
    - cd android
    - ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
    - mkdir -p "$CI_PROJECT_DIR/release"
    - cp app/build/outputs/apk/release/*.apk "$CI_PROJECT_DIR/release/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk"
  artifacts:
    name: "bakalari-mobile-v${RELEASE_VERSION}-arm64-v8a"
    expire_in: 30 days
    when: on_success
    paths:
      - release/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk

build:tablet:
  extends: .android
  script:
    - npx expo prebuild --platform android --clean
    - grep -n 'ndkVersion' android/app/build.gradle
    - cd android
    - ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
    - mkdir -p "$CI_PROJECT_DIR/release"
    - cp app/build/outputs/apk/release/*.apk "$CI_PROJECT_DIR/release/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk"
  artifacts:
    name: "bakalari-mobile-v${RELEASE_VERSION}-armeabi-v7a"
    expire_in: 30 days
    when: on_success
    paths:
      - release/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk

release:
  image: alpine:3.22
  stage: release
  needs:
    - job: build:redmi
      artifacts: true
    - job: build:tablet
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache curl jq
  script:
    - ls -lh release/*.apk
    - |
      for apk in release/*.apk; do
        filename="$(basename "$apk")"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$apk" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bakalari-mobile/${RELEASE_VERSION}/${filename}"
      done
    - |
      assets='[]'
      for apk in release/*.apk; do
        filename="$(basename "$apk")"
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bakalari-mobile/${RELEASE_VERSION}/${filename}"
        assets="$(jq --arg name "$filename" --arg url "$url" '. + [{name:$name,url:$url,link_type:"package"}]' <<< "$assets")"
      done
    - |
      payload="$(jq -n \
        --arg name "Bakaláři Mobile v${RELEASE_VERSION}" \
        --arg tag "v${RELEASE_VERSION}" \
        --arg desc "Bakaláři Mobile v${RELEASE_VERSION} — Android APK release." \
        --argjson assets "$assets" \
        '{name:$name,tag_name:$tag,description:$desc,assets:{links:$assets}}')"
      curl --fail --silent --show-error \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$payload" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
        || curl --fail --silent --show-error \
          --request PUT \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$payload" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/v${RELEASE_VERSION}"

mirror:github:
  image: alpine:3.22
  stage: mirror
  needs:
    - job: build:redmi
      artifacts: true
    - job: build:tablet
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache curl git jq
  script:
    - test -n "$GITHUB_TOKEN"
    - git config user.name "GitLab Mirror"
    - git config user.email "gitlab-mirror@noreply.local"
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/PhateValleyman/bakalari-mobile.git"
    - git push github "HEAD:${CI_COMMIT_BRANCH}" --force
    - |
      api="https://api.github.com/repos/PhateValleyman/bakalari-mobile"
      release_json="$(curl --fail --silent --show-error \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "$api/releases/tags/v${RELEASE_VERSION}" 2>/dev/null || true)"
      release_id="$(jq -r '.id // empty' <<< "$release_json")"
      if [ -z "$release_id" ]; then
        release_json="$(curl --fail --silent --show-error \
          -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg tag "v${RELEASE_VERSION}" --arg name "Bakaláři Mobile v${RELEASE_VERSION}" '{tag_name:$tag,name:$name,draft:false,prerelease:false}')" \
          "$api/releases")"
        release_id="$(jq -r '.id' <<< "$release_json")"
      fi
      test -n "$release_id"
      for apk in release/*.apk; do
        filename="$(basename "$apk")"
        asset="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "$api/releases/$release_id/assets?per_page=100" | jq -r --arg n "$filename" '.[] | select(.name==$n) | .id')"
        if [ -n "$asset" ]; then
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api/releases/assets/$asset"
        fi
        curl --fail --silent --show-error \
          -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary "@$apk" \
          "https://uploads.github.com/repos/PhateValleyman/bakalari-mobile/releases/$release_id/assets?name=${filename}"
      done
