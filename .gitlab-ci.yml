stages:
  - build
  - release
  - mirror
  - notify

variables:
  NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"
  RELEASE_VERSION: "1.3.0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pnpm-store/
    - .gradle/caches/
    - .gradle/wrapper/

.android:
  image: ghcr.io/cirruslabs/android-sdk:36-ndk
  stage: build
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates openjdk-17-jdk unzip git
    - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${NDK_VERSION}"
    - curl -fsSL "https://deb.nodesource.com/setup_${NODE_VERSION}.x" | bash -
    - apt-get install -y -qq nodejs
    - node --version
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm --version
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile

build:redmi:
  extends: .android
  script:
    - npx expo prebuild --platform android --clean
    - grep -n 'ndkVersion' android/app/build.gradle
    - cd android
    - ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
    - mkdir -p "$CI_PROJECT_DIR/release"
    - cp app/build/outputs/apk/release/*.apk "$CI_PROJECT_DIR/release/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk"
  artifacts:
    name: "bakalari-mobile-v${RELEASE_VERSION}-arm64-v8a"
    expire_in: 30 days
    when: on_success
    paths:
      - release/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk

build:tablet:
  extends: .android
  script:
    - npx expo prebuild --platform android --clean
    - grep -n 'ndkVersion' android/app/build.gradle
    - cd android
    - ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
    - mkdir -p "$CI_PROJECT_DIR/release"
    - cp app/build/outputs/apk/release/*.apk "$CI_PROJECT_DIR/release/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk"
  artifacts:
    name: "bakalari-mobile-v${RELEASE_VERSION}-armeabi-v7a"
    expire_in: 30 days
    when: on_success
    paths:
      - release/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk

release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs:
    - job: build:redmi
      artifacts: true
    - job: build:tablet
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache curl
  script:
    - test -f "release/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk"
    - test -f "release/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk"
    - ls -lh release/*.apk
    - |
      for apk in release/*.apk; do
        filename="$(basename "$apk")"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$apk" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bakalari-mobile/${RELEASE_VERSION}/${filename}"
      done
  release:
    tag_name: "v${RELEASE_VERSION}"
    name: "Bakaláři Mobile v${RELEASE_VERSION}"
    description: "Bakaláři Mobile v${RELEASE_VERSION} — Android APK release."
    assets:
      links:
        - name: "bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bakalari-mobile/${RELEASE_VERSION}/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk"
          link_type: "package"
        - name: "bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bakalari-mobile/${RELEASE_VERSION}/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk"
          link_type: "package"

mirror:github:
  image: alpine:3.22
  stage: mirror
  needs:
    - job: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - apk add --no-cache curl git jq
  script:
    - |
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "ERROR: GITHUB_TOKEN is not available to this pipeline."
        echo "Set GitLab CI/CD variable GITHUB_TOKEN and allow it on the master branch."
        exit 1
      fi
    - git config user.name "GitLab Mirror"
    - git config user.email "gitlab-mirror@noreply.local"
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/PhateValleyman/bakalari-mobile.git"
    - git push github "HEAD:${CI_COMMIT_BRANCH}" --force
    - |
      api="https://api.github.com/repos/PhateValleyman/bakalari-mobile"
      release_json="$(curl --fail --silent --show-error \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        "$api/releases/tags/v${RELEASE_VERSION}" 2>/dev/null || true)"
      release_id="$(printf '%s' "$release_json" | jq -r '.id // empty')"
      if [ -z "$release_id" ]; then
        release_json="$(curl --fail --silent --show-error \
          -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg tag "v${RELEASE_VERSION}" --arg name "Bakaláři Mobile v${RELEASE_VERSION}" '{tag_name:$tag,name:$name,draft:false,prerelease:false}')" \
          "$api/releases")"
        release_id="$(printf '%s' "$release_json" | jq -r '.id')"
      fi
      test -n "$release_id"
      for apk in release/*.apk; do
        filename="$(basename "$apk")"
        asset="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "$api/releases/$release_id/assets?per_page=100" | jq -r --arg n "$filename" '.[] | select(.name==$n) | .id')"
        if [ -n "$asset" ]; then
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api/releases/assets/$asset"
        fi
        curl --fail --silent --show-error \
          -X POST \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/vnd.android.package-archive" \
          --data-binary "@$apk" \
          "https://uploads.github.com/repos/PhateValleyman/bakalari-mobile/releases/$release_id/assets?name=${filename}"
      done

# Publish only version-tagged release assets to GitHub without mirroring or overwriting branches.
mirror:github:tag:
  image: alpine:3.22
  stage: mirror
  environment:
    name: release
    action: prepare
  needs:
    - job: build:redmi
      artifacts: true
    - job: build:tablet
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache git python3
  script:
    - |
      # Disable shell tracing and fail closed if the release token is unavailable.
      set +x
      set -e
      test -n "${GITHUB_RELEASE_TOKEN:-}"
      # Verify the protected release tag matches the version used to build both APKs.
      test "$CI_COMMIT_TAG" = "v${RELEASE_VERSION}"
      test -f "release/bakalari-mobile_v${RELEASE_VERSION}_arm64-v8a.apk"
      test -f "release/bakalari-mobile_v${RELEASE_VERSION}_armeabi-v7a.apk"
      # Use a temporary askpass helper so the PAT is never placed in a Git URL or file.
      askpass="$(mktemp)"
      trap 'rm -f "$askpass"' EXIT
      cat > "$askpass" <<'ASKPASS'
      #!/bin/sh
      case "$1" in
        *sername*) printf '%s\n' 'x-access-token' ;;
        *assword*) printf '%s\n' "$GITHUB_RELEASE_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass"
      export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
      # Add a credential-free remote and publish only the current protected release tag.
      git remote add github "https://github.com/PhateValleyman/bakalari-mobile.git"
      remote_listing="$(git ls-remote --refs github "refs/tags/${CI_COMMIT_TAG}")"
      remote_tag="$(printf '%s\n' "$remote_listing" | awk 'NR == 1 { print $1 }')"
      if [ -z "$remote_tag" ]; then
        git push github "HEAD:refs/tags/${CI_COMMIT_TAG}"
      elif [ "$remote_tag" != "$CI_COMMIT_SHA" ]; then
        echo "GitHub already has this tag at a different commit; refusing to move it." >&2
        exit 1
      fi
      # Publish the release and assets with an in-memory HTTP client; never put the PAT in arguments or URLs.
      python3 - <<'PY'
      import json
      import os
      import pathlib
      import urllib.error
      import urllib.parse
      import urllib.request

      # Send authenticated GitHub requests without logging URLs, headers, or exception text.
      def github_request(method, url, body=None, content_type="application/json"):
          headers = {
              "Authorization": "Bearer " + os.environ["GITHUB_RELEASE_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bakalari-mobile-release-bridge",
          }
          if body is not None:
              headers["Content-Type"] = content_type
          request = urllib.request.Request(url, data=body, headers=headers, method=method)
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  raw = response.read()
                  return (json.loads(raw.decode("utf-8")) if raw else {}), response.status
          except urllib.error.HTTPError as error:
              if method == "GET" and error.code == 404:
                  return None, 404
              raise SystemExit(f"GitHub API request failed with HTTP {error.code}") from None
          except Exception as error:
              raise SystemExit(f"GitHub API request failed ({type(error).__name__})") from None

      # Reuse an existing release for this tag or create it if it does not exist yet.
      tag = os.environ["CI_COMMIT_TAG"]
      api = "https://api.github.com/repos/PhateValleyman/bakalari-mobile"
      encoded_tag = urllib.parse.quote(tag, safe="")
      release, status = github_request("GET", f"{api}/releases/tags/{encoded_tag}")
      if status == 404:
          payload = json.dumps({
              "tag_name": tag,
              "name": f"Bakaláři Mobile {tag}",
              "body": "Android APK release published from GitLab CI.",
              "draft": False,
              "prerelease": False,
          }).encode("utf-8")
          release, status = github_request("POST", f"{api}/releases", payload)
      if status not in (200, 201) or not release or not release.get("id"):
          raise SystemExit("GitHub release creation or lookup failed.")

      # Upload only missing APKs and preserve any release assets already present.
      release_id = release["id"]
      assets, status = github_request("GET", f"{api}/releases/{release_id}/assets?per_page=100")
      if status != 200 or not isinstance(assets, list):
          raise SystemExit("GitHub release asset lookup failed.")
      existing_names = {item.get("name") for item in assets}
      version = os.environ["RELEASE_VERSION"]
      apk_files = [
          pathlib.Path(f"release/bakalari-mobile_v{version}_arm64-v8a.apk"),
          pathlib.Path(f"release/bakalari-mobile_v{version}_armeabi-v7a.apk"),
      ]
      for apk in apk_files:
          if apk.name in existing_names:
              print(f"Keeping existing GitHub asset: {apk.name}")
              continue
          upload_url = "https://uploads.github.com/repos/PhateValleyman/bakalari-mobile/releases/" + str(release_id) + "/assets?" + urllib.parse.urlencode({"name": apk.name})
          uploaded, status = github_request("POST", upload_url, apk.read_bytes(), "application/octet-stream")
          if status not in (200, 201) or not uploaded or not uploaded.get("id"):
              raise SystemExit("GitHub release asset upload failed.")

      # Report only the public tag, never the credential or authenticated request URL.
      print(f"GitHub release assets are ready for {tag}.")
      PY

# Deliver both built APKs and a release notice only after GitHub publication succeeds.
notify:telegram:
  image: alpine:3.22
  stage: notify
  environment:
    name: release
    action: prepare
  needs:
    - job: build:redmi
      artifacts: true
    - job: build:tablet
      artifacts: true
    - job: mirror:github:tag
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - apk add --no-cache python3
  script:
    - |
      # Run the Telegram client without shell tracing; the bot URL and token stay in memory only.
      python3 - <<'PY'
      import json
      import os
      import pathlib
      import urllib.error
      import urllib.request
      import uuid

      # Build a multipart request without printing its endpoint or response body.
      def post_multipart(method, fields, file_path=None):
          boundary = "----CueRelease" + uuid.uuid4().hex
          chunks = []
          for name, value in fields.items():
              chunks.extend([
                  f"--{boundary}\r\n".encode(),
                  f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode(),
                  str(value).encode("utf-8"),
                  b"\r\n",
              ])
          if file_path is not None:
              path = pathlib.Path(file_path)
              chunks.extend([
                  f"--{boundary}\r\n".encode(),
                  f'Content-Disposition: form-data; name="document"; filename="{path.name}"\r\n'.encode(),
                  b"Content-Type: application/vnd.android.package-archive\r\n\r\n",
                  path.read_bytes(),
                  b"\r\n",
              ])
          chunks.append(f"--{boundary}--\r\n".encode())
          body = b"".join(chunks)
          # Construct the token-bearing URL only at runtime and never include it in diagnostics.
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/" + method
          request = urllib.request.Request(
              url,
              data=body,
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  status = response.status
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              raise RuntimeError(f"Telegram {method} failed with HTTP {error.code}") from None
          except Exception as error:
              raise RuntimeError(f"Telegram {method} failed ({type(error).__name__})") from None
          if status < 200 or status >= 300 or not result.get("ok"):
              raise RuntimeError(f"Telegram {method} rejected the request (HTTP {status})")

      # Require an exact tag/version match and both APKs below Telegram's 50 MB upload limit.
      tag = os.environ["CI_COMMIT_TAG"]
      version = os.environ["RELEASE_VERSION"]
      if tag != f"v{version}":
          raise SystemExit("Release tag does not match RELEASE_VERSION.")
      files = [
          pathlib.Path(f"release/bakalari-mobile_v{version}_arm64-v8a.apk"),
          pathlib.Path(f"release/bakalari-mobile_v{version}_armeabi-v7a.apk"),
      ]
      for path in files:
          if not path.is_file():
              raise SystemExit("A required release APK is missing.")
          if path.stat().st_size > 50_000_000:
              raise SystemExit(f"APK exceeds Telegram's 50 MB limit: {path.name}")

      # Upload both APKs as multipart data, not by URL, to support files above Telegram's URL-fetch limit.
      chat_id = os.environ["TELEGRAM_CHAT_ID"]
      for path in files:
          post_multipart(
              "sendDocument",
              {"chat_id": chat_id, "caption": f"Bakaláři Mobile {tag} — {path.name}"},
              path,
          )

      # Send the release notice only after both APK uploads succeed.
      text = (
          f"Nové vydání Bakaláři Mobile {tag}.\n"
          f"GitLab: https://gitlab.com/PhateValleyman/bakalari-mobile/-/releases/{tag}\n"
          f"GitHub: https://github.com/PhateValleyman/bakalari-mobile/releases/tag/{tag}"
      )
      post_multipart("sendMessage", {"chat_id": chat_id, "text": text})
      print(f"Telegram delivery succeeded for {tag}: {len(files)} APK files and release notice.")
      PY
