stages:
  - build

variables:
  NDK_VERSION: "29.0.14206865"
  ANDROID_PLATFORM: "android-36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .pnpm-store/
    - .gradle/caches/
    - .gradle/wrapper/

.android:
  image: ghcr.io/cirruslabs/android-sdk:36-ndk
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates openjdk-17-jdk
    - export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - sdkmanager "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${NDK_VERSION}"
    - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
    - apt-get install -y -qq nodejs
    - node --version
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm --version
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --no-frozen-lockfile --prefer-offline

build:redmi:
  extends: .android
  stage: build
  script:
    - npx expo prebuild --platform android --clean
    - grep -n 'ndkVersion' android/app/build.gradle
    - cd android
    - ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
  artifacts:
    name: "bakalari-mobile-redmi-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    when: always
    paths:
      - android/app/build/outputs/apk/release/*.apk

build:tablet:
  extends: .android
  stage: build
  script:
    - npx expo prebuild --platform android --clean
    - grep -n 'ndkVersion' android/app/build.gradle
    - cd android
    - ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
  artifacts:
    name: "bakalari-mobile-tablet-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    when: always
    paths:
      - android/app/build/outputs/apk/release/*.apk
